<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6" />
      <stop offset="50%" style="stop-color:#7c3aed" />
      <stop offset="100%" style="stop-color:#8b5cf6" />
    </linearGradient>
    
    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#e2e8f0" />
    </linearGradient>
    
    <!-- Check Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981" />
      <stop offset="100%" style="stop-color:#34d399" />
    </linearGradient>
    
    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Shield Shape -->
  <path d="M50 18 L72 28 L72 55 Q72 76 50 86 Q28 76 28 55 L28 28 Z" 
        fill="url(#shieldGrad)" opacity="0.95" />
  
  <!-- Shield Border -->
  <path d="M50 18 L72 28 L72 55 Q72 76 50 86 Q28 76 28 55 L28 28 Z" 
        fill="none" stroke="#cbd5e1" stroke-width="1.5" />
  
  <!-- Check Mark -->
  <path d="M38 52 L48 63 L66 41" 
        stroke="url(#checkGrad)" stroke-width="7" fill="none" 
        stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Swap Arrows (Kiri bawah ke kanan atas) -->
  <path d="M30 75 L45 65" 
        stroke="#3b82f6" stroke-width="3" fill="none" 
        stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="46,64 42,60 43,67" fill="#3b82f6" />
  
  <!-- Swap Arrows (Kanan bawah ke kiri atas) -->
  <path d="M70 75 L55 65" 
        stroke="#8b5cf6" stroke-width="3" fill="none" 
        stroke-linecap="round" stroke-linejoin="round" />
  <polygon points="54,64 58,60 57,67" fill="#8b5cf6" />
  
  <!-- Small Dot (Token indicator) -->
  <circle cx="50" cy="50" r="1.5" fill="#3b82f6" opacity="0.5" />
</svg>