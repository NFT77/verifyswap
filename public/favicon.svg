<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f0520" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowRing" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circle">
      <circle cx="16" cy="16" r="15"/>
    </clipPath>
  </defs>

  <!-- Background circle with glow ring -->
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#7c3aed" stroke-width="0.6" stroke-opacity="0.5" filter="url(#glowRing)"/>
  <circle cx="16" cy="16" r="15" fill="url(#bgGlow)"/>

  <!-- Shield body (clipped inside circle) -->
  <g clip-path="url(#circle)">
    <polygon
      points="16,3  26,7.5  26,18  16,29  6,18  6,7.5"
      fill="url(#shieldGrad)"
      stroke="#a78bfa"
      stroke-width="0.9"
      stroke-linejoin="round"
    />
    <!-- Inner shield highlight -->
    <polygon
      points="16,4.8  24.5,8.8  24.5,17.6  16,27.2  7.5,17.6  7.5,8.8"
      fill="none"
      stroke="#c4b5fd"
      stroke-width="0.4"
      stroke-opacity="0.35"
      stroke-linejoin="round"
    />
  </g>

  <!-- Checkmark with cyan glow -->
  <g filter="url(#glowCyan)">
    <polyline
      points="10.5,16.5  14,20.5  21.5,12.5"
      fill="none"
      stroke="#06b6d4"
      stroke-width="2.4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Highlight overlay -->
    <polyline
      points="10.5,16.5  14,20.5  21.5,12.5"
      fill="none"
      stroke="#a5f3fc"
      stroke-width="0.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-opacity="0.7"
    />
  </g>
</svg>